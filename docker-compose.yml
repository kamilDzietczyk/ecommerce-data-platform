services:

  postgres:
    image: postgres:15
    container_name: ecommerce_postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: ecommerce_pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

    ports:
      - "${PGADMIN_PORT}:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      - postgres

    restart: unless-stopped

  dbt:
    build:
      context: ./dbt

    container_name: ecommerce_dbt

    env_file:
      - .env

    environment:
      POSTGRES_HOST: ${POSTGRES_DOCKER_HOST}
      POSTGRES_PORT: ${POSTGRES_DOCKER_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./dbt:/usr/app/dbt
      - ./data:/usr/app/data

    working_dir: /usr/app/dbt

    ports:
      - "${DBT_DOCS_PORT}:8085"

    depends_on:
      - postgres

    tty: true

  airflow-postgres:
    image: postgres:15
    container_name: ecommerce_airflow_postgres

    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${AIRFLOW_DB_USER}"]
      interval: 10s
      retries: 5
      start_period: 5s

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile

    container_name: ecommerce_airflow_init

    depends_on:
      airflow-postgres:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}

      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW_ADMIN_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME}
      AIRFLOW_ADMIN_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL}

      POSTGRES_HOST: ${POSTGRES_DOCKER_HOST}
      POSTGRES_PORT: ${POSTGRES_DOCKER_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - .:/opt/airflow/project

    command: >
      bash -c "airflow db migrate &&
      (airflow users create
      --username $${AIRFLOW_ADMIN_USERNAME}
      --password $${AIRFLOW_ADMIN_PASSWORD}
      --firstname $${AIRFLOW_ADMIN_FIRSTNAME}
      --lastname $${AIRFLOW_ADMIN_LASTNAME}
      --role Admin
      --email $${AIRFLOW_ADMIN_EMAIL} || true)"

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile

    container_name: ecommerce_airflow_webserver

    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-postgres:
        condition: service_healthy
      postgres:
        condition: service_started

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}

      POSTGRES_HOST: ${POSTGRES_DOCKER_HOST}
      POSTGRES_PORT: ${POSTGRES_DOCKER_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - .:/opt/airflow/project

    ports:
      - "${AIRFLOW_PORT}:8080"

    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile

    container_name: ecommerce_airflow_scheduler

    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-postgres:
        condition: service_healthy
      postgres:
        condition: service_started

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}

      POSTGRES_HOST: ${POSTGRES_DOCKER_HOST}
      POSTGRES_PORT: ${POSTGRES_DOCKER_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - .:/opt/airflow/project

    command: scheduler

  metabase:
    image: metabase/metabase:latest
    container_name: ecommerce_metabase

    ports:
      - "${METABASE_PORT}:3000"

    volumes:
      - metabase_data:/metabase-data

    environment:
      MB_DB_FILE: /metabase-data/metabase.db

    depends_on:
      - postgres

  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile

    container_name: ecommerce_ingestion

    env_file:
      - .env

    environment:
      POSTGRES_HOST: ${POSTGRES_DOCKER_HOST}
      POSTGRES_PORT: ${POSTGRES_DOCKER_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - .:/usr/app

    working_dir: /usr/app

    depends_on:
      - postgres

    tty: true
  ai-assistant:
    build:
      context: .
      dockerfile: ai_assistant/Dockerfile

    container_name: ecommerce_ai_assistant

    env_file:
      - .env

    environment:
      POSTGRES_HOST: ${POSTGRES_DOCKER_HOST}
      POSTGRES_PORT: ${POSTGRES_DOCKER_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      AI_DB_USER: ${AI_DB_USER}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
      AI_PROVIDER: ${AI_PROVIDER}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS}

    volumes:
      - .:/usr/app

    working_dir: /usr/app

    ports:
      - "${AI_ASSISTANT_PORT}:8000"

    depends_on:
      - postgres
      
volumes:
  postgres_data:
  pgadmin_data:
  airflow_postgres_data:
  metabase_data: