version: 2

models:

  - name: dim_customers
    description: Customer dimension

    columns:

      - name: customer_id
        tests:
          - unique
          - not_null

      - name: email
        tests:
          - not_null

  - name: dim_products
    description: Product dimension

    columns:

      - name: product_id
        tests:
          - unique
          - not_null

  - name: fct_orders
    description: Orders fact table

    columns:

      - name: order_id
        tests:
          - unique
          - not_null

      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id

  - name: fct_order_items
    description: Order items fact table

    columns:

      - name: order_item_id
        tests:
          - unique
          - not_null

      - name: order_id
        tests:
          - relationships:
              to: ref('fct_orders')
              field: order_id

      - name: product_id
        tests:
          - relationships:
              to: ref('dim_products')
              field: product_id
  
  - name: mart_monthly_sales
    description: Monthly ecommerce sales aggregated for forecasting.

    columns:

      - name: sales_month
        description: First day of the sales month.
        tests:
          - unique
          - not_null

      - name: total_orders
        description: Total number of orders in the month.
        tests:
          - not_null

      - name: total_revenue
        description: Total monthly revenue.
        tests:
          - not_null

      - name: average_order_value
        description: Monthly revenue divided by monthly order count.
        tests:
          - not_null